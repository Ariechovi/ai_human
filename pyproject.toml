[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-human-mini"
version = "0.1.0"
description = "Minimal FastAPI + LangChain RAG + three-tier memory assistant for the ai_human project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "redis>=5.2",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

